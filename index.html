<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة نصيب طنطا V13</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{font-family:Tajawal;box-sizing:border-box}body{margin:0;background:#f8f7ff}.header{background:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05);position:sticky;top:0}.logo{width:44px;height:44px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;cursor:pointer}.hero{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;padding:30px 20px;text-align:center}.card{background:#fff;border-radius:16px;padding:20px;margin:16px;box-shadow:0 4px 20px rgba(0,0,0,.06)}.btn{background:#7c3aed;color:#fff;border:none;padding:12px 20px;border-radius:12px;font-weight:700;cursor:pointer;width:100%;margin:4px 0}.input{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:12px;margin:8px 0}.success{background:#dcfce7;color:#166534;padding:12px;border-radius:12px}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:12px}.hidden{display:none!important}.pkg-row{display:flex;gap:8px;align-items:center;margin:8px 0;padding:10px;background:#f9fafb;border-radius:10px}</style>
</head>
<body>
<div class="header"><div style="display:flex;align-items:center;gap:10px"><div class="logo" id="logo">ن</div><div><b>منصة نصيب</b><div style="font-size:12px;color:#6b7280">V13</div></div></div><span id="vault" style="background:#ede9fe;color:#6d28d9;padding:4px 10px;border-radius:20px;font-size:12px">⏳ يتأكد...</span></div>
<div class="hero"><h1>منصة نصيب - طنطا</h1><p>زواج على سنة الله ورسوله</p><div style="display:flex;justify-content:center;gap:20px"><div><div id="mc" style="font-size:22px;font-weight:800">0</div><div>عضو</div></div><div><div id="ac" style="font-size:22px;font-weight:800">0</div><div>إعلان</div></div></div></div>
<div class="card"><h3>📝 تسجيل عضو</h3><div id="msg"></div><input id="name" class="input" placeholder="الاسم"><input id="phone" class="input" placeholder="التليفون"><select id="type" class="input"><option>عريس</option><option>عروسة</option></select><input id="city" class="input" value="طنطا"><input id="interests" class="input" placeholder="نبذة"><input id="invite" class="input" placeholder="كود دعوة"><button class="btn" onclick="reg()">سجل ✅</button></div>
<div class="card"><h3>🏪 إعلان محلك</h3><input id="shop_name" class="input" placeholder="اسم المحل"><input id="shop_phone" class="input" placeholder="رقم المحل"><select id="cat" class="input"><option>مطعم</option><option>ملابس</option><option>خدمات</option><option>صيدلية</option></select><textarea id="desc" class="input" placeholder="وصف"></textarea><select id="pkg" class="input"></select><button class="btn" style="background:#10b981" onclick="addAd()">إرسال ✅</button></div>
<div class="card"><h3>📋 الأعضاء</h3><div id="ml"></div></div>
<div id="adminM" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50"><div class="card" style="width:90%;max-width:400px"><h3>دخول إدارة</h3><input id="au" class="input" value="admin"><input id="ap" type="password" class="input" value="123456"><button class="btn" onclick="login()">دخول</button><button class="btn" style="background:#e5e7eb;color:#111" onclick="document.getElementById('adminM').classList.add('hidden')">إغلاق</button></div></div>
<div id="adminP" class="hidden card" style="border:2px solid #7c3aed"><h3>🔐 لوحة الأدمن</h3><div style="display:flex;gap:8px"><button class="btn" style="width:auto" onclick="loadAll()">تحديث</button><button class="btn" style="width:auto;background:#ef4444" onclick="document.getElementById('adminP').classList.add('hidden')">خروج</button></div><div style="margin-top:16px;padding:12px;background:#fef3c7;border-radius:12px;border:2px dashed #f59e0b"><h3>💰 إدارة الباقات</h3><div id="pkgEditor"></div><button class="btn" style="background:#f59e0b" onclick="addPkg()">+ إضافة باقة</button><button class="btn" style="background:#10b981" onclick="savePkgs()">💾 حفظ الباقات</button><div id="pkgMsg"></div></div><h4>الأعضاء</h4><div id="am"></div><h4>الإعلانات</h4><div id="aa"></div></div>
<script>
const SUPABASE_URL='https://dqqtzikpmqexnmquabsm.supabase.co';const SUPABASE_KEY='sb_publishable_BE0P7t0h75zCxAkhFt75Dw_pc5K5g5R';const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let defPkgs=[{name:'مجاني - 7 أيام',price:0},{name:'أساسي - شهر',price:100},{name:'مميز - شهرين',price:250},{name:'VIP - 3 شهور',price:500}];
function getPkgs(){try{let s=localStorage.getItem('naseeb_pkgs');return s?JSON.parse(s):defPkgs}catch(e){return defPkgs}}
function saveLS(p){localStorage.setItem('naseeb_pkgs',JSON.stringify(p))}
function renderSel(){let pkgs=getPkgs();document.getElementById('pkg').innerHTML=pkgs.map(p=>`<option>${p.name} - ${p.price}ج</option>`).join('')}
function renderEditor(){let pkgs=getPkgs();document.getElementById('pkgEditor').innerHTML=pkgs.map((p,i)=>`<div class="pkg-row"><input id="pn${i}" value="${p.name}" class="input" style="margin:0"><input id="pp${i}" type="number" value="${p.price}" class="input" style="margin:0;max-width:90px"><button onclick="delPkg(${i})" style="background:#fee2e2;border:none;padding:8px;border-radius:8px">🗑️</button></div>`).join('')}
function addPkg(){let pkgs=getPkgs();pkgs.push({name:'باقة جديدة',price:100});saveLS(pkgs);renderEditor();renderSel()}
function delPkg(i){let pkgs=getPkgs();pkgs.splice(i,1);saveLS(pkgs);renderEditor();renderSel()}
function savePkgs(){let pkgs=getPkgs();let np=pkgs.map((p,i)=>({name:document.getElementById('pn'+i).value,price:parseInt(document.getElementById('pp'+i).value)||0}));saveLS(np);renderSel();document.getElementById('pkgMsg').innerHTML='<div class=success>✅ تم حفظ الباقات</div>'}
let c=0;document.getElementById('logo').addEventListener('click',()=>{c++;if(c>=5){document.getElementById('adminM').classList.remove('hidden');c=0}setTimeout(()=>c=0,3000)});
async function check(){try{const {error}=await supabaseClient.from('members').select('id',{count:'exact',head:true});document.getElementById('vault').innerText=error?'⚠️ اعمل الجداول':'✅ الخزنة شغالة';}catch(e){document.getElementById('vault').innerText='⚠️ خطأ'}}check();
async function reg(){const n=document.getElementById('name').value.trim();const ph=document.getElementById('phone').value.trim();const tp=document.getElementById('type').value;const ct=document.getElementById('city').value;const intr=document.getElementById('interests').value;const ic=document.getElementById('invite').value||'NSB'+Math.floor(1000+Math.random()*9000);if(!n||!ph){alert('الاسم والتليفون');return}try{const {error}=await supabaseClient.from('members').insert([{name:n,phone:ph,city:ct,type:tp,interests:intr,invite_code:ic,points:20}]);if(error)throw error;document.getElementById('msg').innerHTML='<div class=success>✅ تم حفظ '+n+' كودك: '+ic+'</div>';loadAll();}catch(e){document.getElementById('msg').innerHTML='<div class=error>'+e.message+'</div>'}}
async function addAd(){const sn=document.getElementById('shop_name').value;const ph=document.getElementById('shop_phone').value;const cat=document.getElementById('cat').value;const des=document.getElementById('desc').value;const pkg=document.getElementById('pkg').value;if(!sn||!ph){alert('اسم المحل ورقمه');return}try{const {error}=await supabaseClient.from('ads').insert([{shop_name:sn,phone:ph,category:cat,description:des,package:pkg,status:'pending'}]);if(error)throw error;alert('✅ تم إرسال الإعلان');loadAll();}catch(e){alert(e.message)}}
async function loadAll(){try{const {data:m}=await supabaseClient.from('members').select('*').order('created_at',{ascending:false}).limit(50);const {data:a}=await supabaseClient.from('ads').select('*').order('created_at',{ascending:false}).limit(50);document.getElementById('mc').innerText=m?m.length:0;document.getElementById('ac').innerText=a?a.length:0;document.getElementById('ml').innerHTML=m&&m.length?m.map(x=>'<div style="padding:6px;border-bottom:1px solid #eee">👤 '+x.name+' - '+x.type+'</div>').join(''):'لا يوجد';document.getElementById('am').innerHTML=m?m.map(x=>'<div style="display:flex;justify-content:space-between;padding:4px;border-bottom:1px solid #eee"><span>'+x.name+'</span><button onclick="delM(\''+x.id+'\')">مسح</button></div>').join(''):'';document.getElementById('aa').innerHTML=a?a.map(x=>'<div style="display:flex;justify-content:space-between;padding:4px;border-bottom:1px solid #eee"><span>'+x.shop_name+' - '+x.package+'</span><span><button onclick="approve(\''+x.id+'\')">قبول</button><button onclick="delAd(\''+x.id+'\')">مسح</button></span></div>').join(''):'';}catch(e){}}
async function delM(id){await supabaseClient.from('members').delete().eq('id',id);loadAll()}
async function delAd(id){await supabaseClient.from('ads').delete().eq('id',id);loadAll()}
async function approve(id){await supabaseClient.from('ads').update({status:'approved'}).eq('id',id);loadAll()}
function login(){if(document.getElementById('au').value==='admin'&&document.getElementById('ap').value==='123456'){document.getElementById('adminM').classList.add('hidden');document.getElementById('adminP').classList.remove('hidden');renderEditor();loadAll()}}
renderSel();renderEditor();loadAll();
</script>
</body>
                                                                                                                                                             </html>
